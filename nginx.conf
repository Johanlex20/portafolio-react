server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compresión de texto ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/ld+json image/svg+xml text/xml
               application/xml;

    # ---- Cabeceras de seguridad ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Solo se permite cargar código y recursos del propio sitio; el único origen
    # externo es YouTube (modo sin cookies) para los videos de los proyectos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- Caché ----
    # Los archivos de /assets/ llevan un hash en el nombre (index-AbC123.js):
    # si cambian, cambia el nombre, así que pueden cachearse un año.
    # `^~` hace que este prefijo gane sobre las reglas por expresión regular de abajo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header en un location reemplaza a los del server: se repiten los de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Videos e imágenes públicas: nombres estables, caché moderada. Nginx soporta
    # solicitudes por rangos, así que el video puede adelantarse sin descargarse completo.
    location ~* \.(mp4|webp|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El CV se puede actualizar con el mismo nombre: caché corta (1 día).
    location ~* \.pdf$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: así un despliegue nuevo se ve de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cualquier otra ruta devuelve la app (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
