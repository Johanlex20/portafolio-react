<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

    <!-- SEO. Estos textos son los que leen los rastreadores y las redes sociales
         (no ejecutan JavaScript); al cargar, la app los actualiza al idioma activo. -->
    <title>
      Johan Rodríguez · Desarrollador Full-Stack (Java, AWS, Next.js)
    </title>
    <meta
      name="description"
      content="Portafolio de Johan Rodríguez , desarrollador full-stack en Bogotá, Colombia: Java, Spring Boot, AWS, microservicios, Kubernetes y Next.js."
    />
    <link rel="canonical" href="https://portafolio.faseblu.com/" />

    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, Facebook, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Johan Rodríguez" />
    <meta property="og:url" content="https://portafolio.faseblu.com/" />
    <meta
      property="og:title"
      content="Johan Rodríguez · Desarrollador Full-Stack (Java, AWS, Next.js)"
    />
    <meta
      property="og:description"
      content="Java, Spring Boot, AWS, microservicios y Next.js. Mira mi experiencia y mis proyectos."
    />
    <meta
      property="og:image"
      content="https://portafolio.faseblu.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados: le dicen a Google quién es la persona del sitio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Johan Alexander Rodríguez Cadena",
        "jobTitle": "Full-Stack Software Developer",
        "url": "https://portafolio.faseblu.com/",
        "knowsAbout": [
          "Java",
          "Spring Boot",
          "Amazon Web Services",
          "Microservices",
          "Kubernetes",
          "Docker",
          "Next.js",
          "Angular"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bogotá",
          "addressCountry": "CO"
        },
        "sameAs": [
          "https://www.linkedin.com/in/johanlex20/",
          "https://github.com/Johanlex20",
          "https://www.youtube.com/@johanlex20"
        ]
      }
    </script>

    <!-- Tema inicial (claro/oscuro) antes del primer pintado: ver public/theme-init.js -->
    <script src="/theme-init.js"></script>
  </head>

  <body class="bg-surface text-content transition-colors duration-300">
    <div id="root"></div>
    <noscript>
      Este portafolio necesita JavaScript. Contacto:
      <a href="https://www.linkedin.com/in/johanlex20/">LinkedIn</a>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
